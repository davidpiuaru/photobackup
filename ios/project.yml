name: PhotoBackup
options:
  bundleIdPrefix: ro.licenta
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  PhotoBackup:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PhotoBackupApp
    info:
      path: PhotoBackupApp/Info.plist
      properties:
        CFBundleDisplayName: PhotoBackup
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocalNetworkUsageDescription: "Detectează și controlează dispozitivul PhotoBackup de pe rețeaua locală."
        NSBonjourServices:
          - _photobackup._tcp
          - _http._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.licenta.photobackup
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
